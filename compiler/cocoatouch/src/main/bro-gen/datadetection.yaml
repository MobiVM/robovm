package: org.robovm.apple.datadetection
include: [foundation]
library: DataDetection
framework: DataDetection
clang_args: ['-x', 'objective-c']
headers:
    - /System/Library/Frameworks/DataDetection.framework/Headers/DataDetection.h

typedefs:
    
enums:

categories:

classes:
    DDMatch: {} #since 15.0
    DDMatchCalendarEvent: {} #since 15.0
    DDMatchEmailAddress: {} #since 15.0
    DDMatchFlightNumber: {} #since 15.0
    DDMatchLink: {} #since 15.0
    DDMatchMoneyAmount: {} #since 15.0
    DDMatchPhoneNumber: {} #since 15.0
    DDMatchPostalAddress: {} #since 15.0
    DDMatchShipmentTrackingNumber: {} #since 15.0

protocols:

functions:

    # Make sure we don't miss any functions if new ones are introduced in a later version
    (k?DD.*):
        class: FIXME
        name: 'Function__#{g[0]}'

values:

    # Make sure we don't miss any values if new ones are introduced in a later version
    (k?DD.*):
        class: FIXME
        name: 'Value__#{g[0]}'

constants:
    # Make sure we don't miss any constants if new ones are introduced in a later version
    (k?DD.*):
        class: FIXME
        name: 'Constant__#{g[0]}'
