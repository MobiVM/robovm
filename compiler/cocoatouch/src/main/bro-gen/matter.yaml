# common configuration for all classes. if method config is not found in particular
# class it will be looked in here
# useful when there are tonn same methods along multiple classes
default_methods_config:
    '-(.*?)WithParams:.*':
        name: "#{g[0]}"
    '+(.*?)WithParams:.*':
        name: "{g[0]}"
    '-(.*?)WithValue:.*':
        name: "#{g[0]}"
    '+(.*?)WithValue:.*':
        name: "{g[0]}"
    '-(.*?)WithClusterStateCache:.*':
        name: "#{g[0]}"
    '+(.*?)WithClusterStateCache:.*':
        name: "#{g[0]}"
    '-(.*?)WithCompletion:.*':
        name: "#{g[0]}"
    '+(.*?)WithCompletion:.*':
        name: "#{g[0]}"
    '-(.*?)WithExpectedValues:.*':
        name: "#{g[0]}"
    '+(.*?)WithExpectedValues:.*':
        name: "#{g[0]}"
    '-(.*?)WithEndpointID:.*':
        name: "#{g[0]}"

    '-initWithResponseValue:error:':
        name: init
        throws: NSErrorException
    '-initWithDevice:endpointID:queue:':
        name: init
    '[+-](.+?)With.*':
        name: '#{g[0]}'
