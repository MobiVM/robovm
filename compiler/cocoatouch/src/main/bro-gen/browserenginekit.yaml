package: org.robovm.apple.browserenginekit
include: [foundation, uikit, coregraphics, uniformtypeid, coreanimation, avfoundation]
library: BrowserEngineKit
framework: BrowserEngineKit
clang_args: ['-x', 'objective-c']
headers:
