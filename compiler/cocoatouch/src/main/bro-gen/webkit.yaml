functions:
    # Make sure we don't miss any functions if new ones are introduced in a later version
    (k?WK.*):
        class: WebKit
        name: 'Function__#{g[0]}'

values:
    WKErrorDomain:
        class: WKError
        name: getClassDomain

    WKWebsiteDataType(.*):
        enum: WKWebsiteDataType
        name: '#{g[0]}'
        type: NSString

    WKPreviewActionItemIdentifier(.*):
        class: WKPreviewActionItemIdentifiers
        name: '#{g[0]}'

    NSReadAccessURLDocumentOption:
        exclude: true # FIXME: it extends NSAttributedStringDocumentReadingOptionKey that is defined in different framework

    WKWebExtensionMatchPatternErrorDomain:
        class: WKWebExtensionMatchPatternError
        name: getClassDomain
    WKWebExtensionErrorDomain:
        class: WKWebExtensionError
        name: getClassDomain
    WKWebExtensionContextErrorDomain:
