package: org.robovm.apple.gamesave
include: [foundation, uikit]
library: GameSave
framework: GameSave
clang_args: ['-x', 'objective-c']
headers:
    - /System/Library/Frameworks/GameSave.framework/Headers/GameSave.h

typedefs:
    
enums:
    GSSyncState: {}

categories:

classes:
    GSSyncedDirectory:
        methods:
            '-triggerPendingUploadWithCompletionHandler:':
                name: triggerPendingUpload
            '-resolveConflictsWithVersion:':
                name: resolveConflicts
            '-finishSyncingWithCompletionHandler:':
                name: finishSyncing
            '-finishSyncing:completionHandler:':
                name: finishSyncing
    GSSyncedDirectoryState: {}
    GSSyncedDirectoryVersion: {}

protocols:

functions:

    # Make sure we don't miss any functions if new ones are introduced in a later version
    (k?GS.*):
        class: FIXME
        name: 'Function__#{g[0]}'

values:

    # Make sure we don't miss any values if new ones are introduced in a later version
    (k?GS.*):
        class: FIXME
        name: 'Value__#{g[0]}'

constants:
    # Make sure we don't miss any constants if new ones are introduced in a later version
    (k?GS.*):
        class: FIXME
        name: 'Constant__#{g[0]}'
