package: org.robovm.apple.videotoolbox
include: [foundation, corefoundation, coregraphics, corevideo, coremedia, metal]
library: VideoToolbox
framework: VideoToolbox
clang_args: ['-x', 'objective-c']
headers:
    - /System/Library/Frameworks/VideoToolbox.framework/Headers/VideoToolbox.h

typedefs:
    
enums:
    VTDecodeFrameFlags: {prefix: kVTDecodeFrame_}
    VTDecodeInfoFlags: {prefix: kVTDecodeInfo_}
    VTEncodeInfoFlags: {prefix: kVTEncodeInfo_}
    VTCompressionSessionOptionFlags: {} #since 8.0
    VTMotionEstimationFrameFlags: {}
    VTMotionEstimationInfoFlags: {}
    VTFrameProcessorError: {prefix: VTFrameProcessor}
    VTMotionBlurConfigurationQualityPrioritization: {}
    VTMotionBlurConfigurationRevision: {}
    VTMotionBlurParametersSubmissionMode: {}
    VTFrameRateConversionConfigurationQualityPrioritization: {}
    VTFrameRateConversionConfigurationRevision: {}
    VTFrameRateConversionParametersSubmissionMode: {}
    VTOpticalFlowConfigurationQualityPrioritization: {}
    VTOpticalFlowConfigurationRevision: {}
    VTOpticalFlowParametersSubmissionMode: {}
    VTSuperResolutionScalerConfigurationQualityPrioritization: {}
    VTSuperResolutionScalerConfigurationRevision: {}
    VTSuperResolutionScalerConfigurationInputType: {}
    VTSuperResolutionScalerConfigurationModelStatus: {}
    VTSuperResolutionScalerParametersSubmissionMode: {}
    VTErrors: { prefix: kVT, suffix: Err, first: kVTPropertyNotSupportedErr }


categories:

classes:
    # structs
    VTInt32Point: {}
    VTInt32Size: {}
    VTDecompressionOutputCallbackRecord: {} #since 8.0

    # classes
    VTFrameProcessor: #since 26.0
        methods:
            '-startSessionWithConfiguration:error:':
                name: startSession
                throws: NSErrorException
            '-processWithParameters:error:':
                name: process
                throws: NSErrorException
            '-processWithParameters:completionHandler:':
                name: process
            '-processWithParameters:frameOutputHandler:':
                name: process
            '-processWithCommandBuffer:parameters:':
                name: process
    VTFrameProcessorFrame: #since 26.0
        methods:
            '-initWithBuffer:presentationTimeStamp:':
                name: init
    VTFrameProcessorOpticalFlow: #since 26.0
        methods:
            '-initWithForwardFlow:backwardFlow:':
                name: init
    VTFrameRateConversionConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:usePrecomputedFlow:qualityPrioritization:revision:':
                name: init
    VTFrameRateConversionParameters: #since 26.0
        methods:
            '-initWithSourceFrame:nextFrame:opticalFlow:interpolationPhase:submissionMode:destinationFrames:':
                name: init
    VTLowLatencyFrameInterpolationConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:numberOfInterpolatedFrames:':
                name: initWithNumberOfInterpolatedFrames
                static_constructor_name: createWithNumberOfInterpolatedFrames
            '-initWithFrameWidth:frameHeight:spatialScaleFactor:':
                name: initWithSpatialScaleFactor
                static_constructor_name: createWithSpatialScaleFactor
    VTLowLatencyFrameInterpolationParameters: #since 26.0
        methods:
            '-initWithSourceFrame:previousFrame:interpolationPhase:destinationFrames:':
                name: init
    VTLowLatencySuperResolutionScalerConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:scaleFactor:':
                name: init
            '+supportedScaleFactorsForFrameWidth:frameHeight:':
                name: supportedScaleFactors
    VTLowLatencySuperResolutionScalerParameters: #since 26.0
        methods:
            '-initWithSourceFrame:destinationFrame:':
                name: init
    VTMotionBlurConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:usePrecomputedFlow:qualityPrioritization:revision:':
                name: init
    VTMotionBlurParameters: #since 26.0
        methods:
            '-initWithSourceFrame:nextFrame:previousFrame:nextOpticalFlow:previousOpticalFlow:motionBlurStrength:submissionMode:destinationFrame:':
                name: init
    VTOpticalFlowConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:qualityPrioritization:revision:':
                name: init
    VTOpticalFlowParameters: #since 26.0
        methods:
            '-initWithSourceFrame:nextFrame:submissionMode:destinationOpticalFlow:':
                name: init
    VTSuperResolutionScalerConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:scaleFactor:inputType:usePrecomputedFlow:qualityPrioritization:revision:':
                name: init
            '-downloadConfigurationModelWithCompletionHandler:':
                name: downloadConfigurationModel
    VTSuperResolutionScalerParameters: #since 26.0
        methods:
            '-initWithSourceFrame:previousFrame:previousOutputFrame:opticalFlow:submissionMode:destinationFrame:':
                name: init
    VTTemporalNoiseFilterConfiguration: #since 26.0
        methods:
            '-initWithFrameWidth:frameHeight:sourcePixelFormat:':
                name: init
    VTTemporalNoiseFilterParameters: #since 26.0
        methods:
            '-initWithSourceFrame:nextFrames:previousFrames:destinationFrame:filterStrength:hasDiscontinuity:':
                name: init

    VTSessionRef:
        name: VTSession
        extends: CFType
    VTHDRPerFrameMetadataGenerationSessionRef:
        name: VTHDRPerFrameMetadataGenerationSession
        extends: CFType
    VTMultiPassStorageRef:
        name: VTMultiPassStorage
        extends: CFType
    VTCompressionSessionRef:
        name: VTCompressionSession
        extends: CFType
    VTDecompressionSessionRef:
        name: VTDecompressionSession
        extends: CFType
    VTFrameSiloRef:
        name: VTFrameSilo
        extends: CFType
    VTMotionEstimationSessionRef:
        name: VTMotionEstimationSession
        extends: CFType
    VTPixelRotationSessionRef:
        name: VTPixelRotationSession
        extends: CFType
    VTPixelTransferSessionRef:
        name: VTPixelTransferSession
        extends: CFType

protocols:
    VTFrameProcessorConfiguration: {} #since 26.0
    VTFrameProcessorParameters: {} #since 26.0

functions:
    VTCompressionSessionGetTypeID:
        class: VTCompressionSession
        name: TypeID
    VTCompressionSession(.*):
        class: VTCompressionSession
        name: '#{g[0].downcase_first}'

    VTCopySupportedPropertyDictionaryForEncoder:
        class: VTVideoEncoderList
        name: copySupportedPropertyDictionaryForEncoder

    VTCopyVideoEncoderList:
        class: VTVideoEncoderList
        name: copyVideoEncoderList

    VTCreateCGImageFromCVPixelBuffer:
        class: VTUtilities
        name: createCGImageFromCVPixelBuffer

    VTDecompressionSessionGetTypeID:
        class: VTDecompressionSession
        name: TypeID
    VTDecompressionSession(.*):
        class: VTDecompressionSession
        name: '#{g[0].downcase_first}'
    VT(IsHardwareDecodeSupported|IsStereoMVHEVCDecodeSupported|IsStereoMVHEVCEncodeSupported):
        class: VTDecompressionSession
        name: '#{g[0].downcase_first}'

    VTFrameSiloGetTypeID:
        class: VTFrameSilo
        name: TypeID
    VTFrameSilo(.*):
        class: VTFrameSilo
        name: '#{g[0].downcase_first}'

    VTHDRPerFrameMetadataGenerationSessionGetTypeID:
        class: VTHDRPerFrameMetadataGenerationSession
        name: TypeID
    VTHDRPerFrameMetadataGenerationSession(.*):
        class: VTHDRPerFrameMetadataGenerationSession
        name: '#{g[0].downcase_first}'

    VTMotionEstimationSessionGetTypeID:
        class: VTMotionEstimationSession
        name: TypeID
    VTMotionEstimationSession(.*):
        class: VTMotionEstimationSession
        name: '#{g[0].downcase_first}'

    VTMultiPassStorageGetTypeID:
        class: VTMultiPassStorage
        name: TypeID
    VTMultiPassStorageClose:
        class: VTMultiPassStorage
        name: closeStorage
    VTMultiPassStorage(.*):
        class: VTMultiPassStorage
        name: '#{g[0].downcase_first}'

    VTPixelRotationSessionGetTypeID:
        class: VTPixelRotationSession
        name: TypeID
    VTPixelRotationSession(.*):
        class: VTPixelRotationSession
        name: '#{g[0].downcase_first}'

    VTPixelTransferSessionGetTypeID:
        class: VTPixelTransferSession
        name: TypeID
    VTPixelTransferSession(.*):
        class: VTPixelTransferSession
        name: '#{g[0].downcase_first}'

    VTSession(.*):
        class: VTSession
        name: '#{g[0].downcase_first}'

    # Make sure we don't miss any functions if new ones are introduced in a later version
    (k?VT.*):
        class: FIXME
        name: 'Function__#{g[0]}'

