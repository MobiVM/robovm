package: org.robovm.apple.securityui
include: [foundation, uikit, security]
library: SecurityUI
framework: SecurityUI
clang_args: ['-x', 'objective-c']
headers:
    - /System/Library/Frameworks/SecurityUI.framework/Headers/SecurityUI.h

typedefs:
    
enums:

categories:

classes:
    SFCertificatePresentation: #since 18.4
        methods:
            '-initWithTrust:':
                name: init
            '-presentSheetInViewController:dismissHandler:':
                name: presentSheet
protocols:

functions:

    # Make sure we don't miss any functions if new ones are introduced in a later version
    (k?SF.*):
        class: FIXME
        name: 'Function__#{g[0]}'

values:

    # Make sure we don't miss any values if new ones are introduced in a later version
    (k?SF.*):
        class: FIXME
        name: 'Value__#{g[0]}'

constants:
    # Make sure we don't miss any constants if new ones are introduced in a later version
    (k?SF.*):
        class: FIXME
        name: 'Constant__#{g[0]}'
