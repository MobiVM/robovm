name: Build and release IntellijIdea plugin
on:
  workflow_dispatch:
    inputs:
      tagName:
        required: true
        description: 'TAG name for release'
      targetBranch:
        description: 'Branch to build'
        required: true
      releaseMessage:
        required: true
        description: 'Release message'
jobs:
  build:
    runs-on: macos-latest
    env:
      MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      MAVEN_ARGS: -Dmaven.resolver.transport=wagon
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.targetBranch }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          cache: 'maven'
          java-version: '21'
          server-id: sonatype-nexus-snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Install dependencies
        run: |
          brew install openssl
          brew install autoconf
          brew install automake
          brew install libtool

      - name: build IntellijIdea plugin
        run: ./plugins/idea/gradlew -b plugins/idea/build.gradle clean buildPlugin

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: eu-west-3

      - name: Deploy idea plugin
        run: aws s3 sync ./plugins/idea/build/distributions/ s3://${{ secrets.AWS_BUCKET }}/releases/idea --acl public-read --follow-symlinks --delete

      - name: Create a draft release
        uses: ncipollo/release-action@v1
        with:
          name: "${{ github.event.inputs.tagName }}"
          body: "${{ github.event.inputs.releaseMessage }}"
          tag: "${{ github.event.inputs.tagName }}"
          draft: true
          artifacts: "plugins/idea/build/distributions/*"
          token: ${{ secrets.GITHUB_TOKEN }}
